name: Build using CI
on:
  pull_request:
    branches:
      - migration
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: install all dependency
        run: npm install
      - name: Generating Prisma client
        run: npm run db:generate 
      - name: Run build 
        run: npm run build