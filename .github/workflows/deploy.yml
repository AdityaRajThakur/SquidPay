---
name: Build docker image and push to Docker repository
on:
  push:
    branches:
      - migration
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout out repo
        uses: actions/checkout@v2
      - name: Log in to DockerHub
        uses: docker/login-action@v1
        with: 
          username:${{secrets.DOCKER_USERNAME}}
          password:${{secrets.DOCKER_PASSWORD}}
      - name: Build and push to Docker repo(pendrive)
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: pendrive/squidpay:latest
      - name: check build
        run: docker pull pendrive/squidpay:latest
